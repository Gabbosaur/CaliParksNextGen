<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Exercise &amp; Game Mode Selection - CaliParks NextGen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
        "error": "#ffb4ab",
        "surface-container": "#1e2024",
        "surface-tint": "#00dbe7",
        "on-primary-fixed-variant": "#004f54",
        "primary": "#e1fdff",
        "surface-container-highest": "#333539",
        "on-secondary-fixed": "#161e00",
        "on-secondary": "#283500",
        "on-primary-fixed": "#002022",
        "secondary-container": "#c3f400",
        "on-surface": "#e2e2e8",
        "surface-container-lowest": "#0c0e12",
        "on-secondary-fixed-variant": "#3c4d00",
        "on-tertiary-container": "#905000",
        "outline": "#849495",
        "on-tertiary": "#4c2700",
        "on-surface-variant": "#b9cacb",
        "tertiary-fixed": "#ffdcc1",
        "inverse-surface": "#e2e2e8",
        "secondary-fixed-dim": "#abd600",
        "on-primary": "#00363a",
        "primary-fixed": "#74f5ff",
        "primary-container": "#00f2ff",
        "on-primary-container": "#006a71",
        "tertiary-fixed-dim": "#ffb778",
        "on-tertiary-fixed": "#2e1500",
        "on-error": "#690005",
        "on-secondary-container": "#556d00",
        "inverse-primary": "#00696f",
        "surface-dim": "#111318",
        "inverse-on-surface": "#2f3035",
        "error-container": "#93000a",
        "on-error-container": "#ffdad6",
        "tertiary": "#fff6f1",
        "primary-fixed-dim": "#00dbe7",
        "secondary": "#ffffff",
        "on-tertiary-fixed-variant": "#6c3a00",
        "surface": "#111318",
        "surface-container-low": "#1a1c20",
        "surface-variant": "#333539",
        "tertiary-container": "#ffd3af",
        "on-background": "#e2e2e8",
        "background": "#111318",
        "secondary-fixed": "#c3f400",
        "surface-container-high": "#282a2e",
        "surface-bright": "#37393e",
        "outline-variant": "#3a494b"
      },
      "borderRadius": {
        "DEFAULT": "0.25rem",
        "lg": "0.5rem",
        "xl": "0.75rem",
        "full": "9999px"
      },
      "spacing": {
        "touch-target-min": "72px",
        "base": "8px",
        "xs": "4px",
        "sm": "12px",
        "md": "24px",
        "lg": "48px",
        "safe-margin": "64px",
        "xl": "80px"
      },
      "fontFamily": {
        "display-lg": ["Montserrat"],
        "body-md": ["Inter"],
        "label-xl": ["Inter"],
        "display-xl": ["Montserrat"],
        "headline-md": ["Montserrat"],
        "stats-num": ["Montserrat"],
        "headline-lg": ["Montserrat"],
        "body-lg": ["Inter"]
      },
      "fontSize": {
        "display-lg": ["80px", {"lineHeight": "88px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
        "body-md": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
        "label-xl": ["20px", {"lineHeight": "24px", "letterSpacing": "0.1em", "fontWeight": "700"}],
        "display-xl": ["120px", {"lineHeight": "110px", "letterSpacing": "-0.04em", "fontWeight": "900"}],
        "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
        "stats-num": ["64px", {"lineHeight": "64px", "fontWeight": "800"}],
        "headline-lg": ["48px", {"lineHeight": "56px", "fontWeight": "700"}],
        "body-lg": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
      }
    }
  }
}
</script>
<style>
.scanlines {
  background: linear-gradient(to bottom,
    rgba(255,255,255,0),
    rgba(255,255,255,0) 50%,
    rgba(0,0,0,0.2) 50%,
    rgba(0,0,0,0.2));
  background-size: 100% 4px;
  pointer-events: none;
}
.skew-panel {
  transform: skewX(-5deg);
}
.unskew-content {
  transform: skewX(5deg);
}
.neon-bloom-primary {
  box-shadow: 0 0 30px rgba(0, 242, 255, 0.6), inset 0 0 15px rgba(0, 242, 255, 0.4);
  border-color: #00f2ff;
}
.neon-bloom-success {
  box-shadow: 0 0 30px rgba(195, 244, 0, 0.6), inset 0 0 15px rgba(195, 244, 0, 0.4);
  border-color: #c3f400;
}
.hud-border {
  position: absolute;
  width: 20px;
  height: 20px;
  border: 2px solid;
  pointer-events: none;
}
.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.br { bottom: 0; right: 0; border-left: none; border-top: none; }
.tech-bg {
  background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
}

@media (prefers-reduced-motion: no-preference) {
  @keyframes dataSweep {
    0% { transform: translateY(-100%); opacity: 0; }
    50% { opacity: 0.1; }
    100% { transform: translateY(100%); opacity: 0; }
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  @keyframes floatHud {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes spinSlow {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .animate-data-sweep {
    animation: dataSweep 8s linear infinite;
  }
  .animate-pulse-glow {
    animation: pulseGlow 4s ease-in-out infinite;
  }
  .animate-float-hud {
    animation: floatHud 6s ease-in-out infinite;
  }
  .animate-fade-up {
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }
  .animate-spin-slow {
    animation: spinSlow 12s linear infinite;
  }
  .delay-100 { animation-delay: 100ms; }
  .delay-200 { animation-delay: 200ms; }
  .delay-300 { animation-delay: 300ms; }
}
</style>
</head>
<body class="bg-[#05070a] text-on-background min-h-screen overflow-hidden flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container relative tech-bg">

<!-- Scanlines overlay -->
<div class="fixed inset-0 scanlines z-[100] mix-blend-overlay"></div>

<!-- Data Sweep -->
<div class="fixed inset-0 w-full h-[150%] bg-gradient-to-b from-transparent via-primary-container/10 to-transparent z-[90] pointer-events-none animate-data-sweep"></div>

<!-- Ambient Background Lighting -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
  <div class="absolute top-1/4 left-1/4 w-[800px] h-[800px] bg-primary-container/20 rounded-full blur-[150px] mix-blend-screen animate-pulse-glow"></div>
  <div class="absolute bottom-1/4 right-1/4 w-[800px] h-[800px] bg-secondary-container/20 rounded-full blur-[150px] mix-blend-screen animate-pulse-glow" style="animation-delay: -2s;"></div>
</div>

<!-- HUD Overlays -->
<div class="fixed top-sm left-sm font-label-xl text-[10px] text-primary-fixed-dim/60 tracking-widest z-50 pointer-events-none uppercase animate-float-hud">
  SYS.OP.MODE: SELECT<br/>COORD [LAT: 34.0122, LONG: -118.4937]
</div>
<div class="fixed top-sm right-sm font-label-xl text-[10px] text-secondary-fixed/60 tracking-widest z-50 pointer-events-none text-right uppercase flex items-center gap-2 animate-float-hud" style="animation-delay: -1.5s;">
  LINK ACTIVE
</div>
<div class="fixed bottom-sm left-sm font-label-xl text-[10px] text-primary-fixed-dim/60 tracking-widest z-50 pointer-events-none uppercase animate-float-hud" style="animation-delay: -3s;">
  CALIPARKS_OS_v2.4
</div>

<!-- Main Canvas -->
<main class="flex-1 w-full pt-16 pb-safe-margin px-safe-margin relative z-10 flex flex-col justify-center items-center h-screen">
  <div class="w-full max-w-[1400px] mx-auto flex flex-col h-full justify-center">

    <div class="mb-lg text-center relative z-20 animate-fade-up">
      <div class="inline-block relative">
        <h2 class="font-display-xl text-[140px] text-white uppercase tracking-tighter italic leading-none font-black drop-shadow-[0_0_20px_rgba(255,255,255,0.3)] animate-pulse-glow">SELECT MODE</h2>
      </div>
      <div class="flex items-center justify-center gap-4 mt-4">
        <div class="h-[2px] w-24 bg-primary-container/50"></div>
        <p class="font-label-xl text-[16px] text-primary-fixed-dim uppercase tracking-[0.3em] font-bold">Protocol Initialization Required</p>
        <div class="h-[2px] w-24 bg-primary-container/50"></div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-8 xl:gap-16 justify-center items-stretch h-[600px] w-full mt-8">

      <!-- Card 1: AMRAP -->
      <button class="group flex-1 bg-surface-container-low/80 backdrop-blur-md border-l-4 border-r-4 border-t border-b border-primary-container/20 hover:border-primary-container hover:bg-surface-container/90 transition-all duration-500 relative overflow-hidden active:scale-[0.98] hover:scale-[1.02] hover:shadow-[0_0_50px_rgba(0,242,255,0.3)] focus:outline-none focus:ring-4 focus:ring-primary-container text-left shadow-[0_0_30px_rgba(0,0,0,0.5)] max-w-[600px] animate-fade-up delay-100 rounded-[32px]"
        onmouseenter="this.querySelector('.glow-bg').style.opacity = '1'"
        onmouseleave="this.querySelector('.glow-bg').style.opacity = '0'">

        <!-- Corner Accents -->
        <div class="hud-border tl border-primary-container rounded-tl-[32px]"></div>
        <div class="hud-border tr border-primary-container rounded-tr-[32px]"></div>
        <div class="hud-border bl border-primary-container rounded-bl-[32px]"></div>
        <div class="hud-border br border-primary-container rounded-br-[32px]"></div>

        <div class="glow-bg absolute inset-0 bg-primary-container/10 opacity-0 transition-opacity duration-500 pointer-events-none" style="opacity: 0;"></div>

        <div class="h-full p-xl flex flex-col relative z-10">
          <div class="flex justify-between items-start mb-auto">
            <div class="inline-block px-4 py-1 bg-primary-container/20 border border-primary-fixed-dim text-primary-fixed-dim rounded-sm font-label-xl text-[12px] tracking-[0.2em] uppercase font-bold shadow-[0_0_10px_rgba(0,242,255,0.3)] animate-pulse-glow">Class: Dynamic</div>
            <div class="text-primary-container/50 font-stats-num text-2xl font-bold italic">01</div>
          </div>

          <div class="self-center w-56 h-56 rounded-full bg-surface/50 border-4 border-primary-container/20 flex items-center justify-center group-hover:border-primary-container group-hover:bg-primary-container/10 group-hover:shadow-[0_0_60px_rgba(0,242,255,0.6)] transition-all duration-500 relative my-8">
            <span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-all duration-500 group-hover:-translate-y-2 relative z-10" style="font-size: 120px; filter: drop-shadow(0 0 15px rgba(0,242,255,0.8));">fitness_center</span>
            <!-- Orbiting particles -->
            <div class="absolute inset-[-20px] border border-primary-container/30 rounded-full group-hover:border-primary-container transition-colors duration-500 animate-spin-slow">
              <div class="absolute -top-1 left-1/2 -ml-1 w-2 h-2 rounded-full bg-primary-container shadow-[0_0_10px_#00f2ff] animate-pulse-glow"></div>
            </div>
          </div>

          <div class="mt-auto relative z-10">
            <h3 class="text-white mb-2 font-display-lg text-[40px] uppercase italic leading-none group-hover:text-primary-container transition-colors duration-300 drop-shadow-lg">
              AMRAP<br/><span class="text-3xl text-on-surface-variant">Rep King</span>
            </h3>
            <p class="font-label-xl text-[14px] text-on-surface-variant mb-8 border-l-2 border-primary-container/50 pl-4 bg-surface/30 p-2">
              Count max reps in 60s. Maximum velocity, maximum effort. Rest is an illusion.
            </p>
            <div class="w-full h-16 bg-transparent border-2 border-primary-container text-primary-container font-display-lg text-[24px] flex items-center justify-center uppercase italic tracking-wider group-hover:bg-primary-container group-hover:text-on-primary-container transition-all duration-500 relative overflow-hidden group-hover:shadow-[0_0_30px_rgba(0,242,255,0.5)] rounded-full">
              <span class="relative z-10">Initiate Protocol</span>
              <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
            </div>
          </div>
        </div>
      </button>

      <!-- Card 2: Hold Steady -->
      <button class="group flex-1 bg-surface-container-low/80 backdrop-blur-md border-l-4 border-r-4 border-t border-b border-secondary-container/20 hover:border-secondary-container hover:bg-surface-container/90 transition-all duration-500 relative overflow-hidden active:scale-[0.98] hover:scale-[1.02] hover:shadow-[0_0_50px_rgba(195,244,0,0.3)] focus:outline-none focus:ring-4 focus:ring-secondary-container text-left shadow-[0_0_30px_rgba(0,0,0,0.5)] max-w-[600px] animate-fade-up delay-200 rounded-[32px]"
        onmouseenter="this.querySelector('.glow-bg').style.opacity = '1'"
        onmouseleave="this.querySelector('.glow-bg').style.opacity = '0'">

        <!-- Corner Accents -->
        <div class="hud-border tl border-secondary-container rounded-tl-[32px]"></div>
        <div class="hud-border tr border-secondary-container rounded-tr-[32px]"></div>
        <div class="hud-border bl border-secondary-container rounded-bl-[32px]"></div>
        <div class="hud-border br border-secondary-container rounded-br-[32px]"></div>

        <div class="glow-bg absolute inset-0 bg-secondary-container/10 opacity-0 transition-opacity duration-500 pointer-events-none" style="opacity: 0;"></div>

        <div class="h-full p-xl flex flex-col relative z-10">
          <div class="flex justify-between items-start mb-auto">
            <div class="inline-block px-4 py-1 bg-secondary-container/20 border border-secondary-fixed text-secondary-fixed rounded-sm font-label-xl text-[12px] tracking-[0.2em] uppercase font-bold shadow-[0_0_10px_rgba(195,244,0,0.3)] animate-pulse-glow">Class: Static</div>
            <div class="text-secondary-container/50 font-stats-num text-2xl font-bold italic">02</div>
          </div>

          <div class="self-center w-56 h-56 rounded-full bg-surface/50 border-4 border-secondary-container/20 flex items-center justify-center group-hover:border-secondary-container group-hover:bg-secondary-container/10 group-hover:shadow-[0_0_60px_rgba(195,244,0,0.6)] transition-all duration-500 relative my-8">
            <span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary-container transition-all duration-500 group-hover:-translate-y-2 relative z-10" style="font-size: 120px; filter: drop-shadow(0 0 15px rgba(195,244,0,0.8));">accessibility_new</span>
            <!-- Orbiting particles -->
            <div class="absolute inset-[-20px] border border-secondary-container/30 rounded-full group-hover:border-secondary-container transition-colors duration-500 animate-spin-slow" style="animation-direction: reverse;">
              <div class="absolute -bottom-1 right-1/2 -mr-1 w-2 h-2 rounded-full bg-secondary-container shadow-[0_0_10px_#c3f400] animate-pulse-glow"></div>
            </div>
          </div>

          <div class="mt-auto relative z-10">
            <h3 class="text-white mb-2 font-display-lg text-[40px] uppercase italic leading-none group-hover:text-secondary-container transition-colors duration-300 drop-shadow-lg">
              Hold Steady<br/><span class="text-3xl text-on-surface-variant">Isometric</span>
            </h3>
            <p class="font-label-xl text-[14px] text-on-surface-variant mb-8 border-l-2 border-secondary-container/50 pl-4 bg-surface/30 p-2">
              Hold form as long as possible. Absolute structural integrity required under tension.
            </p>
            <div class="w-full h-16 bg-transparent border-2 border-secondary-container text-secondary-container font-display-lg text-[24px] flex items-center justify-center uppercase italic tracking-wider group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-all duration-500 relative overflow-hidden group-hover:shadow-[0_0_30px_rgba(195,244,0,0.5)] rounded-full">
              <span class="relative z-10">Initiate Protocol</span>
              <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
            </div>
          </div>
        </div>
      </button>

    </div>
  </div>
</main>
</body>
</html>
